<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI calculator</title>
    <style>
        body{
            background-color: #212121;
            color: #ffff;
        }
        .container{
            text-align: center;
        }
        button{
            width: 10%;
            padding: .5rem;
            border-radius: 5px;
            border: none;
            background-color: limegreen;
            cursor: pointer;
        }
        /* div #weight-guid{
            margin: 1rem;
        } */
        #results{
            padding: 1rem;
            height: 2rem;
        }
        #results p{
            color: aqua;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        <form action="">
            <p><label for="height">Height in cm:</label><input type="text" id="height"></p>
            <p><label for="weight">Weight in kg:</label><input type="text" id="weight"></p>
            <button>Calculate</button>
            <div id="results"></div>
           
        </form>
        <div id="weight-guid">
            <p>Under Weight= Less than 18.6</p>
            <p>Normal Range = 18.6 to 24.6</p>
            <p>Over Weight = Greater than 24.6</p>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
