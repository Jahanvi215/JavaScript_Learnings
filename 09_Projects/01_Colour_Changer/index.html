<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Changer App</title>
    <style>
        .colour_change{
            margin: 15rem auto;
            text-align: center;
        }
        .button{
            border: none;
            width: 10%;
            padding: 1rem;
            border-radius: 10px;
            cursor: pointer;
        }
        #red{
            background-color: red;
        }
        #yellow{
            background-color: yellow;
        }
        #blue{
            background-color: blue;
        }
        #black{
            background-color: black;
            color: white;
        }
        #violet{
            background-color: violet;
        }
    </style>
</head>
<body>
    <div class="colour_change">
        <button class="button" id="red">Red</button>
        <button class="button" id="yellow">Yellow</button>
        <button class="button" id="blue">Blue</button>
        <button class="button" id="black">Black</button>
        <button class="button" id="violet">Violet</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
